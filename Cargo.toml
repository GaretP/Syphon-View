[package]
name = "syphon-app"
version = "0.2.0"
edition = "2021"
description = "The Syphon app for Windows and Linux: opens straight into your Syphon, at home or through your VPN box, with a TV mode"
license = "AGPL-3.0-only"
publish = false

[[bin]]
name = "syphon-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
axum = "=0.7.9"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rand = "0.8"
hex = "0.4"
sha2 = "0.10"
base64 = "0.22"
if-addrs = "=0.13.4"
keepawake = "0.6"
http-body-util = "0.1"
boringtun = { version = "=0.6.0", default-features = false }
smoltcp = { version = "=0.12.0", default-features = false, features = ["std", "log", "medium-ip", "proto-ipv4", "socket-tcp"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
