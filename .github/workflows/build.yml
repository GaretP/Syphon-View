# Builds the Syphon app for Linux (.deb and AppImage) and Windows (installer .exe and .msi) on GitHub's machines.
# Runs when you push a tag like v0.1.0 (or by hand from the Actions tab). The finished files appear under the run's
# "Artifacts"; download them and attach them to a release.
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-22.04   # an older system on purpose: the app then runs on Debian 12, Ubuntu 22.04 and newer
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev libssl-dev build-essential pkg-config
      - name: Rust (version from rust-toolchain.toml)
        run: rustup show
      - name: Tests
        run: cargo test --locked
      - name: Build
        run: |
          cargo install tauri-cli --version "^2" --locked
          cargo tauri build -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: syphon-app-linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust (version from rust-toolchain.toml)
        run: rustup show
      - name: Tests
        run: cargo test --locked
      - name: Build
        run: |
          cargo install tauri-cli --version "^2" --locked
          cargo tauri build -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: syphon-app-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
